#
# Airframe as a GitHub Action: download one released, checksummed binary for
# this runner, verify it against the release's checksums.txt, and run it.
# Works on Linux, macOS and Windows runners (x64 and arm64); every step is
# bash (Git Bash on Windows). Inputs reach the scripts only through env:, never
# by ${{ }} interpolation into a script.
#
#   - uses: c65llc/airframe@v0
#     with:
#       version: v0.1.0
#       args: lint --json
name: Airframe
description: Run the Airframe CLI (lint, build, fmt and more) on the repository.
author: C65 LLC
branding:
  icon: layers
  color: blue

inputs:
  version:
    description: The exact Airframe release to run, as vX.Y.Z (for example v0.1.0).
    required: true
  args:
    description: >-
      Arguments for airframe, on a single line. Split on whitespace (no shell
      quoting, globbing or expansion), so an argument cannot itself contain a
      space; a multi-line value is an error.
    required: false
    default: lint
  working-directory:
    description: Directory to run airframe in.
    required: false
    default: .

runs:
  using: composite
  steps:
    - name: Install airframe
      id: install
      shell: bash
      env:
        AF_VERSION: ${{ inputs.version }}
        AF_OS: ${{ runner.os }}
        AF_ARCH: ${{ runner.arch }}
        AF_RELEASES: https://github.com/c65llc/airframe/releases/download
      run: |
        set -euo pipefail

        # 1. Validate the version before anything is downloaded.
        if [[ ! "$AF_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::airframe: version must be an exact release such as v0.1.0, got '$AF_VERSION'"
          exit 1
        fi

        # 2. Map the runner to the archive GoReleaser publishes.
        case "$AF_OS" in
          Linux)   os=linux;   ext=tar.gz; exe=airframe ;;
          macOS)   os=darwin;  ext=tar.gz; exe=airframe ;;
          Windows) os=windows; ext=zip;    exe=airframe.exe ;;
          *) echo "::error::airframe: unsupported runner OS '$AF_OS'"; exit 1 ;;
        esac
        case "$AF_ARCH" in
          X64)   arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "::error::airframe: unsupported runner architecture '$AF_ARCH'"; exit 1 ;;
        esac
        archive="airframe_${AF_VERSION#v}_${os}_${arch}.${ext}"

        # 3. Download the archive and checksums.txt into a fresh directory.
        temp="$RUNNER_TEMP"
        if [ "$os" = windows ]; then temp=$(cygpath -u "$RUNNER_TEMP"); fi # D:\a\_temp -> /d/a/_temp
        dir="$temp/airframe-${AF_VERSION}-${os}-${arch}"
        rm -rf "$dir"
        mkdir -p "$dir/bin"
        base="$AF_RELEASES/$AF_VERSION"
        curl -fsSL --retry 3 -o "$dir/$archive" "$base/$archive"
        curl -fsSL --retry 3 -o "$dir/checksums.txt" "$base/checksums.txt"

        # 4. Verify the SHA-256 before extracting or running anything.
        expected=$(awk -v f="$archive" '$2 == f || $2 == "*" f { print $1 }' "$dir/checksums.txt")
        if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
          echo "::error::airframe: checksums.txt has no single SHA-256 entry for $archive"
          exit 1
        fi
        case "$os" in
          darwin) actual=$(shasum -a 256 "$dir/$archive" | awk '{ print $1 }') ;;
          *)      actual=$(sha256sum "$dir/$archive" | awk '{ print $1 }') ;; # Git Bash ships sha256sum on Windows
        esac
        if [ "$actual" != "$expected" ]; then
          echo "::error::airframe: checksum mismatch for $archive (expected $expected, got $actual)"
          exit 1
        fi
        echo "airframe: $archive sha256 $actual verified"

        # 5. Extract into $RUNNER_TEMP.
        if [ "$ext" = zip ]; then
          # shellcheck disable=SC2016 # $env:… is PowerShell's to expand, not bash's
          AF_ZIP=$(cygpath -w "$dir/$archive") AF_DEST=$(cygpath -w "$dir/bin") pwsh -NoProfile -NonInteractive -Command \
            'Expand-Archive -LiteralPath $env:AF_ZIP -DestinationPath $env:AF_DEST -Force'
        else
          tar -xzf "$dir/$archive" -C "$dir/bin"
        fi
        if [ ! -f "$dir/bin/$exe" ]; then
          echo "::error::airframe: $archive does not contain $exe"
          exit 1
        fi
        chmod +x "$dir/bin/$exe" || true
        echo "path=$dir/bin/$exe" >> "$GITHUB_OUTPUT"

    - name: Run airframe
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        AF_BIN: ${{ steps.install.outputs.path }}
        AF_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        # One line, split on whitespace only: no quoting, globbing or expansion.
        # `read` stops at a newline, so a multi-line value is refused rather
        # than silently cut short.
        if [[ "$AF_ARGS" == *$'\n'* || "$AF_ARGS" == *$'\r'* ]]; then
          echo "::error::airframe: args must be a single line (whitespace-split), got a multi-line value"
          exit 1
        fi
        read -ra args <<< "$AF_ARGS"
        "$AF_BIN" ${args[@]+"${args[@]}"}
