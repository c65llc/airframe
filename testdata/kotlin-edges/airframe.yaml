version: 1
content: design-system
modes:
  appearance: {values: [light, dark], binding: runtime, web: {light: ":root", dark: ["@media (prefers-color-scheme: dark) :root:not([data-theme='light'])", ":root[data-theme='dark']"]}}
  density: {values: [compact, standard], base: standard, binding: runtime, web: {attr: data-density}}
platforms:
  android:
    emit: [kotlin]
    out: {kotlin: android/src/main/kotlin/Design.kt}
    options:
      package: com.example.edges
